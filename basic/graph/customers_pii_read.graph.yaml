apiVersion: kyubi/v1
kind: Graph
metadata:
  name: customers_pii_read
  description: Verschlüsselte Kunden wieder lesbar machen – nur mit dem Recht decrypt (KY5806)
parameters:
  - {name: RUN_DATE, type: date, required: true}
  - {name: IN_DIR, type: path, default: "${DATA_ROOT}/in"}
  - {name: OUT_DIR, type: path, default: "${DATA_ROOT}/out"}
components:
  read:
    type: input_file
    params:
      path: "${OUT_DIR}/customers_pii_${fmt(RUN_DATE, '%Y%m%d')}.csv"
      schema: customer_pii
      format: {type: delimited, delimiter: ";", header: true}
  reveal:
    type: decrypt
    params:
      keyring: customer_pii
      fields: [name, birth_date]
      output_schema: customer
  write:
    type: output_file
    params:
      path: "${OUT_DIR}/customers_plain_${fmt(RUN_DATE, '%Y%m%d')}.csv"
      format: semicolon_csv
flows:
  - {from: read.out, to: reveal.in}
  - {from: reveal.out, to: write.in}
