apiVersion: kyubi/v1
kind: Graph
metadata:
  name: customers_mapped
  description: Kunden mit dem Mapping clean_customer bereinigen (Mapper-Beispiel)
parameters:
  - {name: RUN_DATE, type: date, required: true}
  - {name: IN_DIR, type: path, default: "${DATA_ROOT}/in"}
  - {name: OUT_DIR, type: path, default: "${DATA_ROOT}/out"}
components:
  read:
    type: input_file
    params:
      path: "${IN_DIR}/customers_${fmt(RUN_DATE, '%Y%m%d')}.csv"
      schema: customer
      format: semicolon_csv
  clean:
    type: reformat
    params: {mapping: clean_customer, reject_threshold: {max_rejects: 100}}
  write:
    type: output_file
    params:
      path: "${OUT_DIR}/customers_mapped_${fmt(RUN_DATE, '%Y%m%d')}.parquet"
      format: {type: parquet}
  rejected:
    type: output_file
    params:
      path: "${OUT_DIR}/customers_mapped_rejected_${fmt(RUN_DATE, '%Y%m%d')}.csv"
      format: {type: delimited, header: true}
flows:
  - {from: read.out, to: clean.in}
  - {from: clean.out, to: write.in}
  - {from: clean.reject, to: rejected.in}
