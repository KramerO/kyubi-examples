apiVersion: kyubi/v1
kind: Job
metadata:
  name: load_customers
  description: Kundendatei des Tages laden, sobald sie da ist
target: {graph: load_customers}
params:
  RUN_DATE: "${instance.business_date}"
calendar: de_business_days
start_time: "02:00"
depends_on:
  - file: "${env.KYUBI_EXAMPLE_DATA}/in/customers_${fmt(RUN_DATE, '%Y%m%d')}.csv"
    condition: exists
    poll: 30s
    timeout: 4h
resources: {file_slots: 1}
retries: {count: 2, delay: 1m}
timeout: 2h
