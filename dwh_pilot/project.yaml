apiVersion: kyubi/v1
kind: Project
metadata:
  name: dwh_pilot
  description: Pilot – synthetisches DWH (Staging → SCD2-Dimension → Fakten → Mart) als Jobnetz
uses: [shared]   # Kalender aus dem Workspace-Projekt shared (D-109)
scheduler:
  resources: {db_slots: 2}
  max_parallel_jobs: 3
  timezone: Europe/Berlin
  new_day: "00:05"
  notifications:
    channels:
      ops: {type: webhook, url: "${env.KYUBI_PILOT_HOOK}"}   # z. B. Teams-Webhook
    rules:
      - {events: [failed, instance_failed, sla_missed], channels: [ops]}
