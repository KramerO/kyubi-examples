apiVersion: kyubi/v1
kind: Mapping
metadata: {name: link_protein_organism_map, description: 'LINK Protein ↔ Organismus.'}
input: {schema: stage_protein_s}
output: {schema: link_protein_organism_s}
filter: "not is_null(rec.organism_id)"
variables:
  hk_protein: "sha256(rec.accession)"
  hk_organism: "sha256(rec.organism_id)"
fields:
  hk_protein_organism: "sha256(hk_protein, hk_organism)"
  hk_protein: hk_protein
  hk_organism: hk_organism
  business_date: rec.business_date
  record_source: "'uniprot/swissprot'"
